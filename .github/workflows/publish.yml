name: Publish

# Publish to npm on a version tag, via npm trusted publishing (OIDC): no
# long-lived token, no one-time password. Configure the trusted publisher for
# this package on npmjs.com to point at this repo and this workflow file
# (publish.yml), then push a tag like v0.8.0.
on:
  push:
    tags: ['v*']

permissions:
  contents: read
  id-token: write # lets npm exchange a short-lived OIDC token to authenticate

jobs:
  publish:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      # No registry-url: it writes an empty `_authToken=` into .npmrc, which
      # makes npm attempt (empty) token auth and skip the OIDC exchange, so the
      # publish comes back 404. With no token configured, npm does OIDC.
      - uses: actions/setup-node@v4
        with:
          node-version: 22

      # Trusted publishing needs a recent npm (OIDC landed in 11.5.1); the
      # bundled one is too old.
      - run: npm install -g npm@latest

      - run: node --version && npm --version

      # The tag drives the release, but the file that actually ships is
      # package.json — refuse a mismatch rather than publish the wrong version.
      - name: Tag must match package.json version
        run: |
          tag="${GITHUB_REF_NAME#v}"
          pkg="$(node -p "require('./package.json').version")"
          echo "tag=$tag package.json=$pkg"
          test "$tag" = "$pkg"

      # No NODE_AUTH_TOKEN: npm authenticates through the OIDC identity above,
      # and generates provenance automatically for a trusted-publisher release.
      - run: npm publish
