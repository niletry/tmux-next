<!doctype html>
<html lang="zh">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <title>tmux</title>
  <link rel="stylesheet" href="node_modules/@xterm/xterm/css/xterm.css">
  <link rel="stylesheet" href="style.css">
</head>
<body class="term-page">
  <div class="term-bar">
    <a href="./">‹ 会话</a>
    <span class="title" id="title"></span>
    <span class="status" id="status">连接中…</span>
    <button class="term-rename" id="rename" title="重命名会话">改名</button>
    <button class="term-kill" id="kill" title="结束会话">结束</button>
  </div>

  <div id="term"></div>

  <div class="keys">
    <button data-hex="0d" data-usage="enter">⏎</button>
    <button data-hex="1b" data-usage="esc">Esc</button>
    <button data-hex="09" data-usage="tab">Tab</button>
    <button data-hex="1b 5b 5a" data-usage="shift-tab">⇧Tab</button>
    <button id="ctrl" data-usage="ctrl">Ctrl</button>
    <button id="kbd" data-usage="keyboard">⌨</button>
    <button id="img" data-usage="image" title="发送图片" aria-label="发送图片">
      <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor"
           stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
        <rect x="3" y="3" width="18" height="18" rx="2"/>
        <circle cx="8.5" cy="8.5" r="1.5"/>
        <path d="M21 15l-5-5L5 21"/>
      </svg>
    </button>
    <button data-hex="1b 5b 41" data-usage="up">↑</button>
    <button data-hex="1b 5b 42" data-usage="down">↓</button>
    <button data-hex="1b 5b 44" data-usage="left">←</button>
    <button data-hex="1b 5b 43" data-usage="right">→</button>
    <button data-hex="03" data-usage="ctrl-c">^C</button>
  </div>

  <input type="file" id="imgfile" accept="image/*" hidden>


  <script src="node_modules/@xterm/xterm/lib/xterm.js"></script>
  <script src="node_modules/@xterm/addon-webgl/lib/addon-webgl.js"></script>
  <script type="module" src="terminal.js"></script>
</body>
</html>
