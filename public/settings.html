<!doctype html>
<html lang="zh">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <title data-i18n="settings.title">设置</title>
  <link rel="icon" href="favicon.svg" type="image/svg+xml">
  <!-- use-credentials: the manifest is fetched by the browser itself, and
       behind a reverse proxy that asks for a login an anonymous fetch gets
       the login page instead — the install then fails with no visible
       reason. This makes the fetch carry the session cookie. -->
  <link rel="manifest" href="manifest.webmanifest" crossorigin="use-credentials">
  <link rel="apple-touch-icon" href="icon-192.png">
  <link rel="stylesheet" href="style.css">
</head>
<body class="settings-page">
  <header id="header">
  </header>
  <main id="settings"></main>
  <!-- 不预加载 theme-apply.js：这个标签只是 import，模块顶层没有调用，谁看见它
       都会以为这一页的配色已经有人管了——实际上是 settings.js 调的 initTheme()。 -->
  <script type="module" src="settings.js"></script>
</body>
</html>
