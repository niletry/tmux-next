<!doctype html>
<html lang="zh">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <title data-i18n="new.title">新建会话</title>
  <link rel="icon" href="favicon.svg" type="image/svg+xml">
  <!-- use-credentials: the manifest is fetched by the browser itself, and
       behind a reverse proxy that asks for a login an anonymous fetch gets
       the login page instead — the install then fails with no visible
       reason. This makes the fetch carry the session cookie. -->
  <link rel="manifest" href="manifest.webmanifest" crossorigin="use-credentials">
  <link rel="apple-touch-icon" href="icon-192.png">
  <link rel="stylesheet" href="style.css">
</head>
<body class="list-page">
  <!-- A task page, not one of the three siblings: it gets a back arrow and a
       title rather than the page switcher, because it is somewhere you go to do
       one thing and then leave. -->
  <header id="header">
    <a href="./" class="back" data-i18n="new.back">‹ 返回</a>
    <span class="htitle" data-i18n="new.title">新建会话</span>
  </header>
  <main id="new" class="page-body"></main>
  <script type="module" src="new.js"></script>
</body>
</html>
