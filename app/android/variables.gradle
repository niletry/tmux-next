ext {
    minSdkVersion = 24
    compileSdkVersion = 36
    targetSdkVersion = 36
    androidxActivityVersion = '1.11.0'
    androidxAppCompatVersion = '1.7.1'
    androidxCoordinatorLayoutVersion = '1.3.0'
    androidxCoreVersion = '1.17.0'
    androidxFragmentVersion = '1.8.9'
    coreSplashScreenVersion = '1.2.0'
    androidxWebkitVersion = '1.14.0'
    junitVersion = '4.13.2'
    androidxJunitVersion = '1.3.0'
    androidxEspressoCoreVersion = '3.7.0'
    cordovaAndroidVersion = '14.0.1'
}
// Release signing for the distributable APK. Keys live in app/keystore/,
// which is NOT committed; regenerate or keep them private.
ext.releaseKeystore = rootProject.file("../keystore/tmux-next.jks")
ext.releaseStorePass = System.getenv("TMUX_NEXT_STORE_PASS") ?: ""
ext.releaseKeyAlias = "tmux-next"
ext.releaseKeyPass = System.getenv("TMUX_NEXT_KEY_PASS") ?: ""
